<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FactThread 文章核查</title>
  <style>
    :root { --ink: #101828; --muted: #667085; --line: #eaecf0; --bg: #f8f6f1; --blue: #155eef; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; }
    button, textarea, input { font: inherit; }
    header { background: #101828; color: #fff; padding: 0.9rem 1.5rem; }
    header h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.25rem; }
    header p, header a { margin: 0.25rem 0 0; color: #ffffffb8; font-size: 0.85rem; }
    header a { color: #fff; }
    #billing { color: #fff; font-size: 0.95rem; }
    main { max-width: 760px; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }
    form, section, article { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px #00000014; }
    form, section { padding: 1rem; margin-bottom: 1rem; }
    textarea, input[type="text"] { width: 100%; padding: 0.7rem 0.8rem; border: 1px solid #d0d5dd; border-radius: 8px; }
    textarea { min-height: 9rem; resize: vertical; }
    textarea:focus, input[type="text"]:focus { outline: 2px solid var(--blue); border-color: var(--blue); }
    .row { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.75rem; align-items: center; }
    .note { margin-right: auto; color: var(--muted); font-size: 0.9rem; }
    button { background: var(--blue); color: #fff; border: 0; border-radius: 8px; padding: 0.6rem 1.2rem; font-weight: 600; cursor: pointer; }
    button:hover:not(:disabled) { background: #004eeb; }
    button:disabled { background: #98a2b3; cursor: progress; }
    button.secondary { background: #101828; }
    section h2, article h2 { margin: 0 0 0.45rem; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    article { padding: 0.9rem 1rem; margin: 0.7rem 0; }
    label.pick { display: flex; gap: 0.6rem; align-items: flex-start; }
    blockquote { margin: 0.55rem 0; padding: 0.7rem 0.85rem; border-left: 4px solid var(--blue); background: #f8f6f1; border-radius: 0 8px 8px 0; }
    blockquote p { margin: 0; line-height: 1.5; }
    .meta { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    .pill { display: inline-block; color: #fff; border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.85rem; font-weight: 700; background: #667085; }
    .pill.supported { background: #0f7b4c; }
    .pill.refuted { background: #b42318; }
    .pill.insufficient_evidence { background: #667085; }
    .pill.pending { background: #b54708; }
    .source-panel { margin: 0.9rem 0; padding: 0.8rem; border: 1px solid var(--line); border-radius: 8px; }
    #source-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.8; }
    .source-mark { cursor: pointer; border-radius: 3px; padding: 0.05em 0.08em; scroll-margin: 6rem; }
    .source-mark { background: #eef4ff; }
    .source-label.supported, .state-supported { background: #d1fadf; color: #05603a; }
    .source-label.refuted, .state-refuted { background: #fee4e2; color: #912018; }
    .source-label.insufficient_evidence, .state-insufficient_evidence { background: #eaecf0; color: #344054; }
    .source-label.unchecked, .state-unchecked { background: #e0eaff; color: #1849a9; }
    .source-label.waiting, .state-waiting { background: #fef0c7; color: #93370d; }
    .source-label { display: inline-block; vertical-align: super; font: 700 0.66rem/1.2 ui-sans-serif, system-ui, sans-serif; border-radius: 999px; padding: 0.12rem 0.35rem; margin: 0 0.08rem; }
    .legend { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.65rem 0; }
    .legend span, .state-badge { display: inline-block; border-radius: 999px; padding: 0.18rem 0.55rem; font-size: 0.78rem; font-weight: 700; }
    .claim-card { cursor: pointer; scroll-margin: 1rem; }
    .claim-card:hover, .claim-card:focus { outline: 2px solid var(--blue); }
    .comparison { margin: 0.55rem 0; padding: 0.6rem 0.75rem; background: #f2f4f7; border-radius: 8px; }
    .comparison strong { display: block; margin-bottom: 0.25rem; font-size: 0.8rem; color: #475467; }
    .why { font-family: Georgia, "Times New Roman", serif; line-height: 1.55; }
    .src a { color: var(--blue); }
    .error { color: #b42318; background: #fef3f2; border-radius: 8px; padding: 0.7rem 0.9rem; }
    .extract-note { color: #475467; background: #f2f4f7; border-radius: 8px; padding: 0.7rem 0.9rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>FactThread</h1>
    <p><a href="/">返回单条核查</a></p>
    <p id="billing">本次不允许付费模型。本次不允许调用 OpenRouter。</p>
  </header>
  <main>
    <form id="form">
      <input id="source-url" type="url" placeholder="文章来源 URL（可选）">
      <textarea id="article" maxlength="12000" placeholder="粘贴一篇短文" required></textarea>
      <div class="row">
        <span class="note">修改原文后需要重新提取。</span>
        <button id="extract" type="submit">提取</button>
      </div>
    </form>
    <p id="error" class="error" hidden></p>
    <p id="extract-note" class="extract-note" role="status" hidden></p>
    <section id="candidates" hidden>
      <h2>候选条目</h2>
      <div class="source-panel">
        <h2>原文（高亮可定位声明）</h2>
        <div class="legend" aria-label="核查状态图例">
          <span class="state-supported">支持</span><span class="state-refuted">反驳</span>
          <span class="state-insufficient_evidence">证据不足</span><span class="state-unchecked">未核查</span>
          <span class="state-waiting">等待处理</span>
        </div>
        <div id="source-text"></div>
      </div>
      <div id="list"></div>
      <div class="row">
        <span class="note">每批最多选择 3 条，按顺序核查。</span>
        <button id="run" type="button">核查所选</button>
      </div>
    </section>
    <section id="results" hidden>
      <h2>核查结果</h2>
      <div id="cards"></div>
      <p id="wait" class="meta" hidden></p>
      <div class="row">
        <button id="resume" class="secondary" type="button" hidden>继续未完成的条目</button>
      </div>
    </section>
  </main>
  <script>
    const form = document.querySelector("#form");
    const articleBox = document.querySelector("#article");
    const sourceBox = document.querySelector("#source-url");
    const extractButton = document.querySelector("#extract");
    const candidates = document.querySelector("#candidates");
    const list = document.querySelector("#list");
    const runButton = document.querySelector("#run");
    const results = document.querySelector("#results");
    const cards = document.querySelector("#cards");
    const sourceText = document.querySelector("#source-text");
    const resume = document.querySelector("#resume");
    const wait = document.querySelector("#wait");
    const errorBox = document.querySelector("#error");
    const extractNote = document.querySelector("#extract-note");
    const billing = document.querySelector("#billing");
    let articleId = "";
    let extractedText = "";
    let extractedSourceUrl = "";
    let currentCandidates = [];
    let currentClaims = [];
    let selectedCandidateIds = [];
    let currentJobStatus = "";
    let submitted = "";
    let submittedSourceUrl = "";
    let timer = 0;
    let clock = 0;

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      articleId = "";
      extractedText = "";
      extractedSourceUrl = "";
      submitted = articleBox.value.trim();
      submittedSourceUrl = sourceBox.value.trim();
      candidates.hidden = true;
      results.hidden = true;
      extractNote.hidden = true;
      post("/api/articles", { text: articleBox.value, article_source_url: sourceBox.value });
    });
    articleBox.addEventListener("input", invalidateIfChanged);
    sourceBox.addEventListener("input", invalidateIfChanged);
    runButton.addEventListener("click", () => {
      const picked = selected();
      if (!articleId || !picked.ids.length || picked.ids.length > 3) return;
      post(`/api/articles/${articleId}/check`, picked);
    });
    resume.addEventListener("click", () => {
      if (!articleId || resume.disabled) return;
      post(`/api/articles/${articleId}/continue`, {});
    });
    list.addEventListener("change", updateRun);
    list.addEventListener("input", updateRun);

    function selected() {
      const ids = [];
      const claims = {};
      for (const card of list.querySelectorAll("article")) {
        const box = card.querySelector("input[type=checkbox]");
        if (!box.checked) continue;
        ids.push(card.dataset.id);
        claims[card.dataset.id] = card.querySelector("input[type=text]").value;
      }
      return { ids, claims, article_source_url: sourceBox.value };
    }

    function updateRun() {
      const count = selected().ids.length;
      runButton.disabled = !articleId || count < 1 || count > 3;
    }

    function post(url, body) {
      errorBox.hidden = true;
      extractNote.hidden = true;
      extractButton.disabled = true;
      runButton.disabled = true;
      resume.disabled = true;
      fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).then(async (response) => {
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "核查没有完成。");
        articleId = payload.id;
        render(payload);
        poll();
      }).catch((error) => fail(error.message));
    }

    function poll() {
      window.clearTimeout(timer);
      if (!articleId) return;
      fetch(`/api/articles/${articleId}`).then(async (response) => {
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "核查没有完成。");
        render(payload);
        if (payload.status === "running") timer = window.setTimeout(poll, 400);
        else extractButton.disabled = false;
      }).catch((error) => fail(error.message));
    }

    function render(payload) {
      currentJobStatus = payload.status || "";
      if (payload.paid_label && payload.openrouter_label) {
        billing.textContent = `${payload.paid_label}${payload.openrouter_label}`;
      }
      if (payload.status === "extracted" || payload.status === "done") {
        extractedText = submitted;
        extractedSourceUrl = submittedSourceUrl;
        if (articleBox.value.trim() !== extractedText || sourceBox.value.trim() !== extractedSourceUrl) {
          articleId = "";
          candidates.hidden = true;
          results.hidden = true;
          return;
        }
        currentCandidates = payload.candidates || [];
        currentClaims = payload.claims || [];
        selectedCandidateIds = (payload.selected || []).map((item) => item.candidate_id || item);
        drawCandidates(payload.candidates);
        candidates.hidden = !payload.candidates.length;
        if (payload.extraction_status === "empty") {
          extractNote.textContent = "合法空结果：模型没有提取到声明。";
          extractNote.hidden = false;
        } else if (payload.extraction_status === "incomplete") {
          const reason = (payload.extraction_diagnostics || []).map((item) => item.finish_reason).filter(Boolean).pop();
          extractNote.textContent = currentCandidates.length
            ? `模型回复未完整结束（${reason || "未知原因"}）；以下候选是部分结果。`
            : `模型回复未完整结束（${reason || "未知原因"}），且没有生成可用候选。`;
          extractNote.hidden = false;
        } else if (payload.extraction_status === "filtered_empty") {
          const count = (payload.extraction_diagnostics || []).reduce((sum, item) => sum + (item.rejected_count || 0), 0);
          extractNote.textContent = `提取到的声明均未通过原文校验（拒收 ${count} 条）。`;
          extractNote.hidden = false;
        }
        const uncovered = payload.uncovered_sentences || [];
        if (uncovered.length) {
          const note = `未被任何候选覆盖的句子 ${uncovered.length} 句（不代表都需核查）`;
          extractNote.textContent = extractNote.hidden ? note : `${extractNote.textContent} ${note}`;
          extractNote.hidden = false;
        }
      }
      currentCandidates = payload.candidates || currentCandidates;
      currentClaims = payload.claims || [];
      selectedCandidateIds = (payload.selected || []).map((item) => item.candidate_id || item);
      drawClaims(payload.claims || []);
      drawSource(articleBox.value.trim(), currentCandidates, currentClaims, payload.status);
      results.hidden = !(payload.claims || []).length;
      const pending = (payload.claims || []).some((item) => item.verdict_label === "判断：等待重试" && !item.verdict);
      resume.hidden = !pending && !payload.can_continue;
      resume.disabled = payload.status === "running" || !payload.can_continue;
      showWait(payload);
      updateRun();
      if (payload.status === "error") fail(payload.error || "核查没有完成。");
    }

    function drawCandidates(items) {
      const previous = new Map();
      for (const card of list.querySelectorAll("article")) {
        previous.set(card.dataset.id, {
          checked: card.querySelector("input[type=checkbox]").checked,
          claim: card.querySelector("input[type=text]").value,
        });
      }
      list.replaceChildren();
      for (const item of items) {
        const kept = previous.get(item.id);
        const card = document.createElement("article");
        card.dataset.id = item.id;
        card.id = `candidate-${item.id}`;
        const pick = document.createElement("label");
        pick.className = "pick";
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = kept
          ? kept.checked
          : (selectedCandidateIds.length ? selectedCandidateIds.includes(item.id) : Boolean(item.default_selected));
        const heading = document.createElement("span");
        heading.textContent = item.fact_type_label || item.fact_type || "";
        pick.append(box, heading);
        const quote = document.createElement("blockquote");
        const quoteText = document.createElement("p");
        quoteText.textContent = item.source_quote || "";
        quote.append(quoteText);
        const claim = document.createElement("input");
        claim.type = "text";
        claim.value = kept ? kept.claim : (item.normalized_claim || "");
        claim.setAttribute("aria-label", "核查 claim（可编辑）");
        const missing = document.createElement("p");
        missing.className = "meta";
        const gaps = item.missing_context || [];
        const notes = [...(item.normalization_notes || []), ...(item.extraction_notes || [])];
        missing.textContent = gaps.length
          ? `缺失信息：${gaps.join("；")}`
          : (item.context_note || "缺失信息：无");
        if (notes.length) {
          const note = document.createElement("p");
          note.className = "candidate-note";
          note.textContent = notes.join("；");
          card.appendChild(note);
        }
        card.append(pick, quote, claim, missing);
        list.append(card);
      }
    }

    function drawClaims(items) {
      cards.replaceChildren();
      for (const item of items) {
        const card = document.createElement("article");
        card.id = `result-${item.candidate_id}`;
        card.className = "claim-card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        const state = resultState(item);
        card.classList.add(`result-${state.code}`);
        card.addEventListener("click", (event) => {
          if (event.target.closest("a, button")) return;
          scrollToSource(item.candidate_id);
        });
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); scrollToSource(item.candidate_id); }
        });
        const title = document.createElement("h2");
        title.textContent = `本次核查的规范化 claim：${item.claim || ""}`;
        card.append(title);
        const stateBadge = document.createElement("span");
        stateBadge.className = `state-badge state-${state.code}`;
        stateBadge.textContent = state.label;
        card.append(stateBadge);
        const stages = document.createElement("p");
        stages.className = "meta";
        const stageNames = [["search", "搜索"], ["fetch", "读取"], ["judge", "判断"]];
        stages.textContent = stageNames
          .map(([key, label]) => `${label}：${item.stages?.[key]?.label || "未开始"}`)
          .join(" · ");
        card.append(stages);
        if (item.verdict) {
          const pill = document.createElement("span");
          pill.className = "pill " + item.verdict;
          pill.textContent = item.verdict_label || "";
          const why = document.createElement("p");
          why.className = "why";
          why.textContent = item.explanation || "";
          card.append(pill, why);
        } else if (item.verdict_label) {
          const line = document.createElement("p");
          line.className = "meta";
          line.textContent = item.status_note ? `${item.verdict_label}。${item.status_note}` : item.verdict_label;
          card.append(line);
        }
        const evidence = document.createElement("h2");
        evidence.textContent = item.evidence_heading || "已获取的证据";
        card.append(evidence);
        const retrieval = item.evidence_retrieval || {};
        const retrievalLine = document.createElement("p");
        retrievalLine.className = "meta";
        retrievalLine.textContent = `引用页面数：${item.citation_page_count ?? 0} · ${item.support_scope_label || "尚无引用页面"}`;
        card.append(retrievalLine);
        for (const read of item.verdict ? [] : item.reads || []) {
          const row = document.createElement("p");
          row.className = "meta";
          row.textContent = `${read.role_label || ""} ${read.detail || ""} ${read.url || ""}`;
          card.append(row);
        }
        for (const cite of item.citations || []) {
          const block = document.createElement("blockquote");
          const quote = document.createElement("p");
          quote.textContent = cite.excerpt || cite.quote || "";
          block.append(quote);
          if (cite.url) {
            const source = document.createElement("div");
            source.className = "src";
            const link = document.createElement("a");
            link.href = cite.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = cite.url;
            source.append(link);
            block.append(source);
          }
          const tag = document.createElement("div");
          tag.className = "meta";
          tag.textContent = cite.role_label || "外部页面";
          block.append(tag);
          card.append(block);
        }
        if (!(item.citations || []).length) {
          const empty = document.createElement("p");
          empty.className = "meta";
          empty.textContent = "还没有读到页面段落。";
          card.append(empty);
        }
        cards.append(card);
      }
    }

    function showWait(payload) {
      window.clearInterval(clock);
      if (!payload.cooling || !payload.retry_at) {
        wait.hidden = true;
        return;
      }
      const deadline = new Date(payload.retry_at).getTime();
      const tick = () => {
        const left = Math.ceil((deadline - Date.now()) / 1000);
        if (left <= 0) {
          window.clearInterval(clock);
          wait.hidden = true;
          resume.disabled = false;
          return;
        }
        resume.disabled = true;
        const minutes = Math.floor(left / 60);
        const seconds = left % 60;
        wait.hidden = false;
        wait.textContent = `剩余 ${minutes} 分 ${seconds} 秒后可继续未完成的条目`;
      };
      tick();
      clock = window.setInterval(tick, 1000);
    }

    function fail(message) {
      errorBox.hidden = false;
      errorBox.textContent = message;
      extractButton.disabled = false;
      updateRun();
    }

    function stateLabel(value) {
      if (value === true) return "是";
      if (value === false) return "否";
      return "待判断";
    }

    const STATES = {
      supported: { code: "supported", label: "支持", color: "#d1fadf" },
      refuted: { code: "refuted", label: "反驳", color: "#fee4e2" },
      insufficient_evidence: { code: "insufficient_evidence", label: "证据不足", color: "#eaecf0" },
      unchecked: { code: "unchecked", label: "未核查", color: "#e0eaff" },
      waiting: { code: "waiting", label: "等待处理", color: "#fef0c7" },
    };

    function resultState(item) {
      if (item.verdict && STATES[item.verdict]) return STATES[item.verdict];
      if ((item.verdict_label || "").includes("等待重试") || (currentJobStatus === "running" && selectedCandidateIds.includes(item.candidate_id))) return STATES.waiting;
      return STATES.unchecked;
    }

    function drawSource(text, items, claimResults, jobStatus) {
      sourceText.replaceChildren();
      const ranges = [];
      for (const item of items || []) {
        for (const range of item.source_ranges || []) {
          const cpStart = Number(range[0]); const cpEnd = Number(range[1]);
          if (!Number.isInteger(cpStart) || !Number.isInteger(cpEnd) || cpStart < 0 || cpEnd <= cpStart) continue;
          const start = codePointOffsetToUtf16(text, cpStart); const end = codePointOffsetToUtf16(text, cpEnd);
          if (end > text.length) continue;
          if (text.slice(start, end) !== item.source_quote) continue;
          ranges.push({ start, end, id: item.id });
        }
      }
      const boundaries = [...new Set(ranges.flatMap((range) => [range.start, range.end]))].sort((a, b) => a - b);
      if (!boundaries.length) { sourceText.textContent = text; return; }
      let cursor = 0;
      for (const point of boundaries) {
        if (point > cursor) sourceText.append(document.createTextNode(text.slice(cursor, point)));
        const next = boundaries[boundaries.indexOf(point) + 1];
        if (next === undefined) { cursor = point; continue; }
        const ids = [...new Set(ranges.filter((range) => range.start <= point && range.end >= next).map((range) => range.id))];
        const segment = text.slice(point, next);
        if (!ids.length) sourceText.append(document.createTextNode(segment));
        else {
          const states = [...new Map(ids.map((id) => {
            const state = resultState((claimResults || []).find((claim) => claim.candidate_id === id) || { candidate_id: id });
            return [state.code, state];
          })).values()];
          const mark = document.createElement("mark");
          mark.className = `source-mark ${states.length > 1 ? "mixed" : states[0].code}`;
          mark.dataset.candidateIds = ids.join(",");
          mark.tabIndex = 0;
          mark.setAttribute("role", "button");
          mark.setAttribute("aria-label", `${ids.join(", ")}：${states.map((state) => state.label).join("、")}`);
          if (states.length > 1) {
            mark.style.setProperty("--mark-a", states[0].color);
            mark.style.setProperty("--mark-b", states[1].color);
          }
          mark.append(document.createTextNode(segment));
          const label = document.createElement("span");
          label.className = `source-label ${states[0].code}`;
          const claims = ids.map((id) => (items || []).find((item) => item.id === id)?.normalized_claim).filter(Boolean);
          label.textContent = `${ids.join("/")} ${states.map((state) => state.label).join("/")} · 对应 claim：${claims.join("；")}`;
          mark.append(label);
          const navigate = () => scrollToResult(ids[0]);
          mark.addEventListener("click", (event) => { event.stopPropagation(); navigate(); });
          mark.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); navigate(); } });
          sourceText.append(mark);
        }
        cursor = next;
      }
      if (cursor < text.length) sourceText.append(document.createTextNode(text.slice(cursor)));
    }

    function scrollToResult(candidateId) {
      const target = document.getElementById(`result-${candidateId}`) || document.getElementById(`candidate-${candidateId}`);
      target?.scrollIntoView({ behavior: "smooth", block: "center" });
      target?.focus({ preventScroll: true });
    }

    function scrollToSource(candidateId) {
      const target = [...sourceText.querySelectorAll(".source-mark")].find((mark) => mark.dataset.candidateIds.split(",").includes(candidateId));
      target?.scrollIntoView({ behavior: "smooth", block: "center" });
      target?.focus({ preventScroll: true });
    }

    function codePointOffsetToUtf16(text, offset) {
      let units = 0;
      let points = 0;
      for (const character of text) {
        if (points >= offset) break;
        units += character.length;
        points += 1;
      }
      return units;
    }

    function invalidateIfChanged() {
      if (!extractedText) return;
      if (articleBox.value.trim() === extractedText && sourceBox.value.trim() === extractedSourceUrl) return;
      articleId = "";
      extractedText = "";
      extractedSourceUrl = "";
      currentCandidates = [];
      currentClaims = [];
      selectedCandidateIds = [];
      currentJobStatus = "";
      candidates.hidden = true;
      results.hidden = true;
      extractNote.hidden = true;
      list.replaceChildren();
      cards.replaceChildren();
      sourceText.replaceChildren();
    }
  </script>
</body>
</html>
